<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Romp Mini - Motion Smasher</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; }
    video { display: none; }
    #ui {
      position: absolute; top: 15px; left: 20px; color: #fff;
      font-size: 26px; font-weight: bold; text-shadow: 2px 2px 8px #000;
      pointer-events: none; z-index: 10;
    }
    #startBtn {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 36px; font-size: 22px; font-weight: bold; color: #fff;
      background: #ff0055; border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 0 20px #ff0055; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="ui">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
  <button id="startBtn" onclick="initGame()">START CAMERA GAME</button>
  <video id="webcam" playsinline></video>
  <canvas id="gameCanvas"></canvas>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');

let score = 0, lives = 3, gameRunning = false;
let handPositions = [];
let targets = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Spawn targets (Green orbs = Hit, Red bombs = Avoid)
function spawnTarget() {
  if (!gameRunning) return;
  const isBomb = Math.random() < 0.22;
  targets.push({
    x: Math.random() * (canvas.width - 100) + 50,
    y: -40,
    radius: isBomb ? 32 : 38,
    speed: Math.random() * 3.5 + 3.5,
    isBomb: isBomb,
    color: isBomb ? '#ff2222' : '#00ffcc'
  });
  setTimeout(spawnTarget, Math.max(400, 1100 - score * 8));
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0, // 0 = Lite mode for fast 30-60 FPS on Galaxy F23
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

hands.onResults((results) => {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Mirror the camera feed horizontally so movements feel natural
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  handPositions = [];
  if (results.multiHandLandmarks) {
    for (const landmarks of results.multiHandLandmarks) {
      // Landmark 9 is the center of the palm
      const palm = landmarks[9];
      const hx = (1 - palm.x) * canvas.width; // Flipped X to match mirror
      const hy = palm.y * canvas.height;
      handPositions.push({ x: hx, y: hy });

      // Draw glowing hand trackers
      ctx.beginPath();
      ctx.arc(hx, hy, 42, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 230, 0, 0.45)';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffea00';
      ctx.stroke();
    }
  }

  // Update & draw targets
  if (gameRunning) {
    for (let i = targets.length - 1; i >= 0; i--) {
      let t = targets[i];
      t.y += t.speed;

      ctx.beginPath();
      ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
      ctx.fillStyle = t.color;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // Check collision with either hand
      let hit = false;
      for (const h of handPositions) {
        const dist = Math.hypot(t.x - h.x, t.y - h.y);
        if (dist < t.radius + 42) {
          hit = true;
          break;
        }
      }

      if (hit) {
        if (t.isBomb) {
          lives--;
          livesEl.innerText = lives;
          if (lives <= 0) resetGame();
        } else {
          score += 10;
          scoreEl.innerText = score;
        }
        targets.splice(i, 1);
        continue;
      }

      if (t.y > canvas.height + 50) {
        targets.splice(i, 1);
      }
    }
  }
});

function resetGame() {
  gameRunning = false;
  alert('Game Over! Final Score: ' + score);
  score = 0; lives = 3; targets = [];
  scoreEl.innerText = score; livesEl.innerText = lives;
  document.getElementById('startBtn').style.display = 'block';
}

function initGame() {
  document.getElementById('startBtn').style.display = 'none';
  gameRunning = true;
  spawnTarget();

  const camera = new Camera(video, {
    onFrame: async () => { await hands.send({ image: video }); },
    width: 640,
    height: 480,
    facingMode: 'user'
  });
  camera.start();
}
</script>
</body>
</html>
